- id: src-bongard
  kind: source
  passage: 'Polyfunctionality, one substrate carrying several readouts at once [@bongard2023], is an inward
    form of externalization: several functions are overloaded onto the same material, and the arrangement
    counts as a discount only when the hardware saved exceeds the added interference and readout cost.'
  evidence:
    citation_id: bongard2023
    locator: Abstract
    verified: true
    verification_note: DOI 10.3390/biomimetics8010110; title and abstract describe biological systems
      as evolved, overloaded, multi-scale machines in which form and function are entwined. Bound for
      the polyfunctionality attribution only.
- id: benford-values
  kind: interpretation
  passage: $$P(D=d)=\log_{10}\!\left(1+\tfrac{1}{d}\right),\qquad P(D=1)\approx 0.301,\quad P(D=9)\approx
    0.046.$$
  rationale: 'Arithmetic from the stated law: log10(2) = 0.30103 and log10(10/9) = 0.04576, which round
    to 0.301 and 0.046.'
- id: def-hdl
  kind: definition
  passage: A heavily discounted lunch is a case in which coupling a system to a structured substrate sharply
    lowers the effective cost of obtaining a reusable family of outcomes, relative to a matched alternative
    that must construct or search for those outcomes more independently.
  rationale: Central stipulative definition of the paper.
- id: def-discount
  kind: definition
  passage: The discount in currency $j$ is the ratio
  rationale: Defines D_j as baseline effective cost over substrate-and-interface effective cost, with
    H_j = log10 D_j.
- id: def-vector
  kind: definition
  passage: No single scalar score captures the phenomenon, because costs trade against one another.
  rationale: Motivates the discount vector over search, samples, energy, control, communication, construction,
    repair and description length.
- id: def-leverage
  kind: definition
  passage: Leverage relates this breadth to the cost of the interface,
  rationale: Defines Lambda_epsilon = log(1 + Gamma_epsilon) / (C_setup + C_interface).
- id: seven-operations
  kind: interpretation
  passage: Across sources, the mechanisms reduce to seven operations.
  rationale: Classification proposed by the paper (entailment, equivalence, compression, delegation, amortization,
    externalization, protection); a conceptual claim, not an empirical finding.
- id: nfl-consistency
  kind: interpretation
  passage: 'The discount and the theorem are therefore consistent, and the theorem adds a constraint:
    the discount must be conditional, and a prior that buys competence on the matched distribution must
    cost competence elsewhere.'
  rationale: Follows from the No-Free-Lunch theorem as stated (uniform averaging over all objective functions).
- id: penalty-prediction
  kind: interpretation
  passage: The framework accordingly predicts that every real subsidy has such a region.
  rationale: Prediction derived from the No-Free-Lunch constraint; each case study names its penalty regime.
- id: info-bound
  kind: interpretation
  passage: A closed deterministic program cannot produce algorithmic information beyond that present in
    its program, inputs, and initial conditions, up to a fixed additive constant [@li2008].
  rationale: Standard result of algorithmic information theory (textbook statement); not checked against
    a page of the cited book in this migration.
- id: ion-channel-weaker
  kind: interpretation
  passage: The accurate statement is weaker.
  rationale: 'The paper''s correction of the free-lunch framing for switching: an ion channel supplies
    nonlinearity, and gain, cascadability, isolation, power and memory are further costed requirements.'
- id: capability-threshold
  kind: assumption
  passage: The quantity of interest is how capability grows as these requirements are met, and we propose
    that it grows by thresholds.
  rationale: Proposed hypothesis (capability phase transitions), stated as a proposal and made testable
    in the research program.
- id: completeness-efficiency
  kind: interpretation
  passage: Completeness and efficiency are different properties, and this defines the limit of the case.
  rationale: Functional completeness guarantees existence of a circuit, not its size, depth or discoverability.
- id: benford-fraud
  kind: normative
  passage: A deviation from Benford's law is evidence of fraud only after the generative and sampling
    conditions have been shown to justify the prior; without that step, the deviation is at least as likely
    to reflect the range of the data.
  rationale: Methodological recommendation following from the conditions under which the law holds.
- id: body-computes
  kind: normative
  passage: A defensible claim that a body computes requires a fixed input encoding, a task specified before
    the readout is chosen, a constrained readout that cannot be retuned per input, comparison against
    matched controls, generalization to inputs held out of readout training, and perturbation of the physical
    degrees of freedom that are supposed to perform the work.
  rationale: Evidential standard proposed by the paper for morphological-computation claims.
- id: ontology-open
  kind: interpretation
  passage: The operational evidence is strong, the ontology is open, and the two must be kept separate.
  rationale: The morphogenesis data are consistent with attractor, control-loop, collective-computation,
    developmental-bias and Platonic readings; the paper does not choose among them.
- id: ladder-levels
  kind: interpretation
  passage: Most established discounts reach levels 2 to 4.
  rationale: Assessment by the paper of where established cases sit on its seven-level inference ladder.
- id: level6
  kind: interpretation
  passage: Level 6 is a separate and much stronger inference, reached only by ruling out the physical
    and computational accounts at level 5, which no case in this area has done.
  rationale: Central evidential conclusion regarding the Platonic-space proposal.
- id: scramble-control
  kind: assumption
  passage: In every case, the test of whether a structure supplies a discount is to destroy the structure
    while holding component count and energy fixed, and to check that the discount disappears.
  rationale: The proposed diagnostic control of the research program; assumes the structure can be destroyed
    without changing component count or energy.
- id: cross-entropy
  kind: assumption
  passage: proposed as a comparative hypothesis across systems and not as a physical law.
  rationale: The cross-entropy scaling of search cost is explicitly a hypothesis.
- id: accounting-error
  kind: interpretation
  passage: Every strong discount must have a demonstrable mismatch region in which it becomes neutral
    or harmful; by the No-Free-Lunch constraint, a purported subsidy that helps everywhere indicates an
    accounting error.
  rationale: Falsifiable prediction derived from the No-Free-Lunch theorem.
