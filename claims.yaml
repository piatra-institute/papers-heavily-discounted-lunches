claims:
- id: src-levin-blog
  kind: source
  passage: 'On his account, physical systems are interfaces onto a latent space of mathematical and agential
    patterns that are discovered and not authored, and evolution draws competence from that space at a
    discount he calls a free lunch: once a voltage-gated ion channel exists, truth tables come for free,
    and once two angles of a triangle are fixed, the third needs no separate determination [@levin2026;
    @levin2022].'
  evidence:
    citation_id: levin2026
    locator: Blog post text
    verified: true
    verification_note: 'Blog post read at thoughtforms.life (published 2026-03-31): patterns are "discovered,
      not created"; the Platonic Space offers patterns for which learning and evolution "do not need to
      pay", with the example that once a voltage-gated ion channel is found, "truth tables (and facts
      like the special nature of NAND) are yours for free". The triangle example was not found in the
      post and is not covered by this check.'
- id: src-mcgeer
  kind: source
  passage: A two-legged machine with an appropriate mass distribution walks down a shallow slope with
    no motor, controller, or feedback, its gait supplied by gravity and its own geometry [@mcgeer1990].
  evidence:
    citation_id: mcgeer1990
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1177/027836499000900206; the Crossref abstract: a class of two-legged machines
      settles into a steady gait on a shallow slope without active control or energy input, powered only
      by gravity.'
- id: src-nakajima
  kind: source
  passage: A soft silicone arm driven at its base performs enough nonlinear filtering in its material
    that a trained linear readout of its deformations computes functions the base signal alone does not
    [@nakajima2015].
  evidence:
    citation_id: nakajima2015
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1038/srep10487; the Crossref abstract: body dynamics of a soft silicone
      arm are exploited for real-time computation, emulating nonlinear dynamical systems.'
- id: src-durant
  kind: source
  passage: 'A brief, targeted perturbation of endogenous bioelectric gradients in a regenerating planarian
    produces a persistent change in the anatomy the fragment rebuilds: a fixed fraction of worms become
    two-headed and continue to regenerate as two-headed through further rounds of cutting without further
    intervention [@durant2017].'
  evidence:
    citation_id: durant2017
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1016/j.bpj.2017.04.011; abstract (OpenAlex): brief modulation of bioelectric
      dynamics yields a constant ratio of two-headed to normal regenerates, and subsequent amputations
      in water reproduce the same ratio.'
- id: src-wolpert-nfl
  kind: source
  passage: '@wolpert1997 proved that when performance is averaged with equal weight over all objective
    functions, every optimizer performs identically, and superiority on one class of problems is offset
    by inferiority on its complement.'
  evidence:
    citation_id: wolpert1997
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1109/4235.585893; abstract (OpenAlex): no-free-lunch theorems establish
      that for any algorithm elevated performance over one class of problems is offset by performance
      over another class.'
- id: src-candes-donoho
  kind: source
  passage: Compressed sensing recovers a sparse signal exactly from far fewer measurements than the naive
    bound requires, provided the signal is sparse in a basis incoherent with the sampling [@candes2006;
    @donoho2006].
  evidence:
    citation_id: donoho2006
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1109/TIT.2006.871582; abstract (OpenAlex): signals compressible in a known
      basis can be recovered from far fewer nonadaptive measurements than their size. Candès et al. (abstract,
      DOI 10.1109/TIT.2005.862083) show exact reconstruction of sparse spike trains from incomplete Fourier
      samples.'
