- id: src-gumuskaya
  kind: source
  passage: Adult human airway cells, released from their tissue and cultured, self-construct into motile
    ciliated multicellular bodies that were never selected for and that heal wounds in a neural sheet
    [@gumuskaya2024].
  evidence:
    citation_id: gumuskaya2024
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1002/advs.202303575; abstract (Europe PMC): single adult human lung cells
      self-construct into cilia-powered motile biobots that traverse and induce repair of scratches in
      cultured human neural cell sheets.'
- id: src-kriegman
  kind: source
  passage: A cluster of frog cells of a particular geometry gathers loose cells into new clusters that
    move and gather in turn [@kriegman2021].
  evidence:
    citation_id: kriegman2021
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1073/pnas.2112672118; significance statement: cell clusters freed from
      a developing organism find and combine loose cells into clusters that look and move like them; AI-designed
      shapes replicate better.'
- id: src-zhang
  kind: source
  passage: Classical sorting algorithms rewritten as populations of autonomous elements, each applying
    the sort rule locally, show added robustness and non-monotone trajectories that have been described
    as delayed gratification; because the full code and intervention history are available, the behavioural
    vocabulary can be tied to perturbation tests [@zhang2024].
  evidence:
    citation_id: zhang2024
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1177/10597123241269740; the full Crossref abstract: arrays of autonomous
      elements each implementing the sort policy sort themselves more reliably and robustly than traditional
      implementations under errors, and can temporarily reduce progress to navigate around a defect (the
      behaviour the sentence calls delayed gratification).'
- id: src-kashtan
  kind: source
  passage: A modularity study reproduces and extends the modularly varying goals result of @kashtan2005,
    mapping the boundary at which reusable structure stops accelerating adaptation and begins to mislead
    it, which makes evolvability a measurable property of a genotype-phenotype map [@wagner1996].
  evidence:
    citation_id: kashtan2005
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1073/pnas.0503610102; the Crossref abstract: networks evolved under goals
      that change in a modular fashion acquire modularity and network motifs.'
- id: src-berger
  kind: source
  passage: The underlying object is the scale-invariant density $f(s)=1/(s\ln b)$ on the significand,
    the multiplicative geometry of positive quantities normalized to a single order of magnitude, of which
    the decimal frequencies are the base-10 projection [@berger2011].
  evidence:
    citation_id: berger2011
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1214/11-PS175; abstract (OpenAlex): survey of the logarithmic distribution
