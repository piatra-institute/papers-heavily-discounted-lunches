abstract: |-
  Complex systems routinely command families of useful behaviour whose explicit design, learning, or evolutionary cost looks far too small for their scope: one switch composes into all of Boolean logic, logarithmic representation hands over an entire leading-digit distribution, a compliant body walks with no controller, local cells rebuild an anatomy no genome stores. Michael Levin calls these free lunches from a Platonic space of patterns. We keep the phenomena and drop the word free. Each is a heavily discounted lunch: the world supplies a pre-existing regularity, the system pays to build an interface to it, and a family of consequences arrives at low marginal cost, in no violation of thermodynamics or the No-Free-Lunch theorems. We make the intuition an accounting one, with a vector-valued discount across cost currencies, an accounting boundary that records who paid and when, a taxonomy that reduces to seven operations (entailment, equivalence, compression, delegation, amortization, externalization, protection), four case studies each required to exhibit a regime where its interface becomes a penalty, and an inference ladder separating a regularity from access to it and cost reduction from any claim about a new ontology. Operationally strict and metaphysically open, the framework replaces the question of whether a lunch is free with the question of which structure supplied the discount and where the rest of the cost was paid.
