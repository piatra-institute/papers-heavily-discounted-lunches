abstract: 'Many complex systems command families of useful behaviour whose explicit design, learning,
  or evolutionary cost appears small relative to their scope. A single nonlinear switch composes into
  all of Boolean logic; logarithmic representation yields a full leading-digit distribution; a compliant
  body walks downhill without a controller; dissociated cells rebuild an anatomy that no genome stores
  cell by cell. Levin groups such cases as free lunches drawn from a Platonic space of patterns. We retain
  the phenomena and treat each as a heavily discounted lunch: the world supplies a pre-existing regularity,
  the system pays to build an interface to it, and a family of consequences follows at low marginal cost.
  This violates neither thermodynamics nor the No-Free-Lunch theorems, which equalize optimizers only
  under uniform averaging over an unrestricted problem class. We formalize the discount as a vector across
  search, samples, description length, computation, energy, control, communication, construction, and
  repair, measured against a matched baseline within an explicit accounting boundary that records who
  paid and when. A two-axis taxonomy separates the source of a subsidy from its mechanism, and the mechanisms
  reduce to seven operations: entailment, equivalence, compression, delegation, amortization, externalization,
  and protection. Four case studies (functional completeness, Benford''s law, morphological computation,
  and morphogenesis) each identify a regime in which the interface becomes a penalty. A seven-level inference
  ladder separates the existence of a regularity from access to it, cost reduction from adaptive competency,
  and competency from claims of new ontology. The resulting question for any apparently disproportionate
  competence is which structure supplied the discount and where the remaining cost was paid.'
web_blurb: 'Apparent free lunches in logic, statistics, robotics, and development are discounts: a system
  pays to interface with pre-existing structure and gains a family of outcomes cheaply. A vector-valued
  ledger and a seven-level inference ladder make the discounts measurable.'
